name: Extract project archive

on:
  push:
    branches:
      - main
    paths:
      - "Final (2).zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract project files safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import shutil
          import zipfile

          repo = Path.cwd()
          archive = repo / "Final (2).zip"
          if not archive.is_file():
              raise SystemExit("Arquivo Final (2).zip não foi encontrado na raiz.")

          destination = Path(os.environ["RUNNER_TEMP"]) / "radar-extracted"
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir(parents=True)

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = PurePosixPath(info.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Caminho inseguro no ZIP: {info.filename}")
                  target = (destination / Path(*name.parts)).resolve()
                  if not target.is_relative_to(destination.resolve()):
                      raise SystemExit(f"Caminho fora da pasta de extração: {info.filename}")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)

          candidates = [
              p.parent for p in destination.rglob("app.py")
              if (p.parent / "requirements.txt").is_file()
          ]
          if not candidates:
              raise SystemExit(
                  "O ZIP foi extraído, mas não encontrei app.py junto com requirements.txt. "
                  "Nenhum arquivo foi publicado."
              )

          source = min(candidates, key=lambda p: len(p.parts))
          required = ["app.py", "requirements.txt", "index.html"]
          missing = [name for name in required if not (source / name).is_file()]
          if missing:
              raise SystemExit("Faltam arquivos essenciais no ZIP: " + ", ".join(missing))

          excluded_dirs = {".git", ".venv", "venv", "__pycache__", "node_modules", ".github"}
          excluded_names = {".env", "radar.db", "radar.sqlite", "database.db"}
          copied = []

          for item in source.rglob("*"):
              relative = item.relative_to(source)
              if any(part in excluded_dirs for part in relative.parts):
                  continue
              if item.name in excluded_names or item.name.endswith((".db", ".sqlite", ".sqlite3", ".pyc")):
                  continue
              if item.is_dir():
                  continue
              target = repo / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(item, target)
              copied.append(relative.as_posix())

          if not copied:
              raise SystemExit("Nenhum arquivo de projeto foi extraído.")

          archive.unlink()
          print("Arquivos publicados na raiz:")
          for name in sorted(copied):
              print(" -", name)
          PY

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/extract-project.yml
          git add -A
          git diff --cached --quiet && {
            echo "Nenhuma alteração para publicar."
            exit 0
          }
          git commit -m "Extract Radar project files for Railway deployment"
          git push origin HEAD:main
